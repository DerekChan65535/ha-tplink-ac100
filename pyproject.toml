[project]
name = "ha-tplink-ac100"
version = "0.2.1"
description = "Local Home Assistant integration for TP-LINK TL-AC100 controllers"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "homeassistant==2026.11.1",
  "pytest-homeassistant==2026.11.1",
  "ruff>=0.14.0",
  "paramiko>=4.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:respx"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ASYNC"]
